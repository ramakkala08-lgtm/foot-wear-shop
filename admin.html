<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Urban Steps</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --accent-blue: #1976d2;
            --accent-purple: #7c3aed;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-dark);
        }

        /* LOGIN PAGE */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .login-subtitle {
            color: var(--text-light);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #loginError {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        /* ADMIN PANEL */
        .admin-container {
            display: none;
            min-height: 100vh;
        }

        .admin-container.active {
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 32px;
            color: var(--accent-blue);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 12px;
        }

        .sidebar-link {
            display: block;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 500;
        }

        .sidebar-link:hover {
            background: var(--bg-primary);
            color: var(--accent-blue);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.1), rgba(124, 58, 237, 0.1));
            color: var(--accent-blue);
            font-weight: 600;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 24px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SETTINGS SECTION */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .setting-card {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .setting-card h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* PRODUCTS/CATEGORIES */
        .content-card {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .add-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .items-list {
            list-style: none;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }

        .item-detail {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.2);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-dark);
        }

        .modal-form {
            display: grid;
            gap: 16px;
        }

        .form-group-col {
            display: flex;
            flex-direction: column;
        }

        .form-group-col label {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-col input,
        .form-group-col select,
        .form-group-col textarea {
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group-col input:focus,
        .form-group-col select:focus,
        .form-group-col textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .modal-btn-secondary {
            background: var(--bg-primary);
            color: var(--text-dark);
        }

        .modal-btn-secondary:hover {
            background: var(--border);
        }

        /* ALERTS */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
                margin-bottom: 20px;
            }

            .main-content {
                margin-left: 0;
            }

            .sidebar-menu {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 8px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="login-title">🔐 Admin Panel</div>
            <div class="login-subtitle">Urban Steps Footwear Shop</div>
            <div id="loginError"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Access Code</label>
                    <input type="password" id="accessCode" placeholder="Enter access code" autofocus>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-container" id="adminContainer">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">🏪 Admin</div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a class="sidebar-link active" onclick="switchSection('dashboard')">📊 Dashboard</a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="switchSection('settings')">⚙️ Shop Settings</a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="switchSection('categories')">📁 Categories</a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="switchSection('products')">👟 Products</a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="logout()">🚪 Logout</a>
                </li>
            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- DASHBOARD -->
            <div id="dashboard" class="section active">
                <div class="header-bar">
                    <div class="header-title">Dashboard</div>
                </div>
                <div class="settings-grid">
                    <div class="setting-card">
                        <h3>📦 Total Products</h3>
                        <div style="font-size: 32px; font-weight: 700; color: var(--accent-blue);" id="totalProducts">0</div>
                    </div>
                    <div class="setting-card">
                        <h3>📁 Categories</h3>
                        <div style="font-size: 32px; font-weight: 700; color: var(--accent-purple);" id="totalCategories">0</div>
                    </div>
                    <div class="setting-card">
                        <h3>💰 Average Price</h3>
                        <div style="font-size: 32px; font-weight: 700; color: #10b981;" id="avgPrice">₹0</div>
                    </div>
                </div>
            </div>

            <!-- SHOP SETTINGS -->
            <div id="settings" class="section">
                <div class="header-bar">
                    <div class="header-title">Shop Settings</div>
                </div>
                <div class="content-card">
                    <div id="settingsAlert"></div>
                    <form onsubmit="saveShopSettings(event)" class="modal-form">
                        <div class="form-group-col">
                            <label>Shop Name</label>
                            <input type="text" id="shopNameInput" required>
                        </div>
                        <div class="form-group-col">
                            <label>Logo URL</label>
                            <input type="url" id="logoUrlInput" required>
                        </div>
                        <div class="form-group-col">
                            <label>WhatsApp Number (with country code)</label>
                            <input type="text" id="whatsappInput" placeholder="919876543210" required>
                        </div>
                        <div class="form-group-col">
                            <label>Phone Number</label>
                            <input type="tel" id="phoneInput" required>
                        </div>
                        <button type="submit" class="add-btn" style="width: 100%; margin-top: 16px;">Save Settings</button>
                    </form>
                </div>
            </div>

            <!-- CATEGORIES -->
            <div id="categories" class="section">
                <div class="header-bar">
                    <div class="header-title">Categories</div>
                    <button class="add-btn" onclick="openAddCategoryModal()">+ Add Category</button>
                </div>
                <div class="content-card">
                    <div id="categoriesAlert"></div>
                    <ul class="items-list" id="categoriesList"></ul>
                </div>
            </div>

            <!-- PRODUCTS -->
            <div id="products" class="section">
                <div class="header-bar">
                    <div class="header-title">Products</div>
                    <button class="add-btn" onclick="openAddProductModal()">+ Add Product</button>
                </div>
                <div class="content-card">
                    <div id="productsAlert"></div>
                    <ul class="items-list" id="productsList"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <!-- Add Category Modal -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">Add Category</div>
            <form onsubmit="addCategory(event)" class="modal-form">
                <div class="form-group-col">
                    <label>Category Name</label>
                    <input type="text" id="categoryNameInput" required autofocus>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn modal-btn-primary">Add</button>
                    <button type="button" class="modal-btn modal-btn-secondary" onclick="closeModal('categoryModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header" id="productModalTitle">Add Product</div>
            <form onsubmit="saveProduct(event)" class="modal-form">
                <div class="form-group-col">
                    <label>Product Name</label>
                    <input type="text" id="productNameInput" required>
                </div>
                <div class="form-group-col">
                    <label>Price (₹)</label>
                    <input type="number" id="productPriceInput" required>
                </div>
                <div class="form-group-col">
                    <label>Image URL</label>
                    <input type="url" id="productImageInput" required>
                </div>
                <div class="form-group-col">
                    <label>Category</label>
                    <select id="productCategoryInput" required></select>
                </div>
                <div class="form-group-col">
                    <label>Sizes (comma-separated, e.g., 6,7,8,9)</label>
                    <input type="text" id="productSizesInput" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn modal-btn-primary" id="submitBtn">Add Product</button>
                    <button type="button" class="modal-btn modal-btn-secondary" onclick="closeModal('productModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // DEFAULT DATA
        // ============================================
        const DEFAULT_SHOP = {
            name: 'Urban Steps',
            logo: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100&h=100&fit=crop',
            whatsapp: '919876543210',
            phone: '+919876543210'
        };

        const DEFAULT_CATEGORIES = ['Sneakers', 'Formal Shoes', 'Sandals', 'Slippers'];

        const DEFAULT_PRODUCTS = [
            {
                id: 1,
                name: 'Nike Air Sneakers',
                price: 4999,
                image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [7, 8, 9, 10]
            },
            {
                id: 2,
                name: 'Adidas Street Shoes',
                price: 3999,
                image: 'https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [6, 7, 8]
            },
            {
                id: 3,
                name: 'Leather Formal Shoes',
                price: 5999,
                image: 'https://images.unsplash.com/photo-1507340941369-f8e0b0541bed?w=400&h=300&fit=crop',
                category: 'Formal Shoes',
                sizes: [8, 9, 10]
            },
            {
                id: 4,
                name: 'Beach Sandals',
                price: 1999,
                image: 'https://images.unsplash.com/photo-1611592437281-460bfbe1220a?w=400&h=300&fit=crop',
                category: 'Sandals',
                sizes: [6, 7, 8, 9, 10, 11]
            },
            {
                id: 5,
                name: 'Premium Slippers',
                price: 1499,
                image: 'https://images.unsplash.com/photo-1556821552-2e12c7db20b4?w=400&h=300&fit=crop',
                category: 'Slippers',
                sizes: [6, 7, 8, 9, 10]
            },
            {
                id: 6,
                name: 'Running Shoes',
                price: 6999,
                image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [7, 8, 9, 10, 11]
            }
        ];

        const ADMIN_PASSWORD = '1234';

        // ============================================
        // STATE
        // ============================================
        let shop = {};
        let categories = [];
        let products = [];
        let editingProductId = null;

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadDataFromStorage();
            updateDashboard();
        });

        function loadDataFromStorage() {
            const storedShop = localStorage.getItem('shopData');
            shop = storedShop ? JSON.parse(storedShop) : DEFAULT_SHOP;

            const storedCategories = localStorage.getItem('categories');
            categories = storedCategories ? JSON.parse(storedCategories) : DEFAULT_CATEGORIES;

            const storedProducts = localStorage.getItem('products');
            products = storedProducts ? JSON.parse(storedProducts) : DEFAULT_PRODUCTS;

            // Initialize next product ID
            if (products.length > 0) {
                window.nextProductId = Math.max(...products.map(p => p.id)) + 1;
            } else {
                window.nextProductId = 1;
            }
        }

        // ============================================
        // LOGIN
        // ============================================
        function handleLogin(event) {
            event.preventDefault();
            const code = document.getElementById('accessCode').value;

            if (code === ADMIN_PASSWORD) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').classList.add('active');
                updateDashboard();
                renderCategories();
                renderProducts();
            } else {
                document.getElementById('loginError').textContent = 'Invalid access code';
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('accessCode').value = '';
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                document.getElementById('loginContainer').style.display = 'flex';
                document.getElementById('adminContainer').classList.remove('active');
                document.getElementById('accessCode').value = '';
                switchSection('dashboard');
            }
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');

            if (sectionId === 'dashboard') {
                updateDashboard();
            } else if (sectionId === 'products') {
                renderProducts();
            } else if (sectionId === 'categories') {
                renderCategories();
            } else if (sectionId === 'settings') {
                loadSettingsForm();
            }
        }

        // ============================================
        // DASHBOARD
        // ============================================
        function updateDashboard() {
            const avgPrice = products.length > 0 
                ? Math.round(products.reduce((sum, p) => sum + p.price, 0) / products.length)
                : 0;

            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalCategories').textContent = categories.length;
            document.getElementById('avgPrice').textContent = `₹${avgPrice}`;
        }

        // ============================================
        // SETTINGS
        // ============================================
        function loadSettingsForm() {
            document.getElementById('shopNameInput').value = shop.name;
            document.getElementById('logoUrlInput').value = shop.logo;
            document.getElementById('whatsappInput').value = shop.whatsapp;
            document.getElementById('phoneInput').value = shop.phone;
        }

        function saveShopSettings(event) {
            event.preventDefault();
            shop = {
                name: document.getElementById('shopNameInput').value,
                logo: document.getElementById('logoUrlInput').value,
                whatsapp: document.getElementById('whatsappInput').value,
                phone: document.getElementById('phoneInput').value
            };
            localStorage.setItem('shopData', JSON.stringify(shop));
            showAlert('settingsAlert', '✅ Shop settings saved!', 'success');
        }

        // ============================================
        // CATEGORIES
        // ============================================
        function renderCategories() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = categories.map((cat, idx) => `
                <li class="list-item">
                    <div class="item-info">
                        <div class="item-name">${cat}</div>
                    </div>
                    <div class="item-actions">
                        <button class="icon-btn" onclick="deleteCategory(${idx})" title="Delete">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        function openAddCategoryModal() {
            document.getElementById('categoryNameInput').value = '';
            openModal('categoryModal');
        }

        function addCategory(event) {
            event.preventDefault();
            const name = document.getElementById('categoryNameInput').value.trim();

            if (!name) {
                alert('Category name is required');
                return;
            }

            if (categories.includes(name)) {
                alert('Category already exists');
                return;
            }

            categories.push(name);
            saveData();
            closeModal('categoryModal');
            renderCategories();
            updateProductCategoryOptions();
            showAlert('categoriesAlert', '✅ Category added!', 'success');
        }

        function deleteCategory(idx) {
            if (confirm('Delete this category?')) {
                categories.splice(idx, 1);
                saveData();
                renderCategories();
                updateProductCategoryOptions();
                showAlert('categoriesAlert', '✅ Category deleted!', 'success');
            }
        }

        // ============================================
        // PRODUCTS
        // ============================================
        function renderProducts() {
            const list = document.getElementById('productsList');
            if (products.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">No products yet. Add one to get started!</div>';
                return;
            }

            list.innerHTML = products.map(product => `
                <li class="list-item">
                    <div class="item-info">
                        <div class="item-name">${product.name}</div>
                        <div class="item-detail">
                            ${product.category} • ₹${product.price} • Sizes: ${product.sizes.join(', ')}
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="icon-btn" onclick="openEditProductModal(${product.id})" title="Edit">✏️</button>
                        <button class="icon-btn" onclick="deleteProduct(${product.id})" title="Delete">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        function openAddProductModal() {
            editingProductId = null;
            document.getElementById('productModalTitle').textContent = 'Add Product';
            document.getElementById('submitBtn').textContent = 'Add Product';
            document.getElementById('productNameInput').value = '';
            document.getElementById('productPriceInput').value = '';
            document.getElementById('productImageInput').value = '';
            document.getElementById('productSizesInput').value = '';
            updateProductCategoryOptions();
            openModal('productModal');
        }

        function openEditProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            editingProductId = productId;
            document.getElementById('productModalTitle').textContent = 'Edit Product';
            document.getElementById('submitBtn').textContent = 'Save Changes';
            document.getElementById('productNameInput').value = product.name;
            document.getElementById('productPriceInput').value = product.price;
            document.getElementById('productImageInput').value = product.image;
            document.getElementById('productSizesInput').value = product.sizes.join(',');
            updateProductCategoryOptions(product.category);
            openModal('productModal');
        }

        function saveProduct(event) {
            event.preventDefault();

            const productData = {
                name: document.getElementById('productNameInput').value,
                price: parseInt(document.getElementById('productPriceInput').value),
                image: document.getElementById('productImageInput').value,
                category: document.getElementById('productCategoryInput').value,
                sizes: document.getElementById('productSizesInput').value.split(',').map(s => parseInt(s.trim()))
            };

            if (editingProductId) {
                // Edit existing
                const product = products.find(p => p.id === editingProductId);
                Object.assign(product, productData);
            } else {
                // Add new
                products.push({
                    id: window.nextProductId++,
                    ...productData
                });
            }

            saveData();
            closeModal('productModal');
            renderProducts();
            updateDashboard();
            showAlert('productsAlert', editingProductId ? '✅ Product updated!' : '✅ Product added!', 'success');
        }

        function deleteProduct(productId) {
            if (confirm('Delete this product?')) {
                products = products.filter(p => p.id !== productId);
                saveData();
                renderProducts();
                updateDashboard();
                showAlert('productsAlert', '✅ Product deleted!', 'success');
            }
        }

        function updateProductCategoryOptions(selectedCategory = '') {
            const select = document.getElementById('productCategoryInput');
            select.innerHTML = categories.map(cat => 
                `<option value="${cat}" ${cat === selectedCategory ? 'selected' : ''}>${cat}</option>`
            ).join('');
        }

        // ============================================
        // DATA MANAGEMENT
        // ============================================
        function saveData() {
            localStorage.setItem('shopData', JSON.stringify(shop));
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('products', JSON.stringify(products));
        }

        // ============================================
        // MODALS
        // ============================================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ============================================
        // ALERTS
        // ============================================
        function showAlert(elementId, message, type) {
            const container = document.getElementById(elementId);
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            container.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
