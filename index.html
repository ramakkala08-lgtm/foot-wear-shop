<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Steps - Footwear Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-darker: #1a1a1a;
            --bg-card: #2a2a2a;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 24px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: fit-content;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg-card);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 25px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .header-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            color: var(--accent-cyan);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-purple);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        /* HERO */
        .hero {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 24px;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .hero-search {
            max-width: 500px;
            margin: 0 auto;
        }

        .hero-search input {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 30px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
            transition: all 0.3s;
        }

        .hero-search input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 60px rgba(6, 182, 212, 0.4);
        }

        /* FILTERS */
        .filters {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .filter-label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-btn {
            padding: 8px 18px;
            background: var(--bg-card);
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 25px;
            color: var(--text-secondary);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-color: var(--accent-cyan);
            color: white;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        /* PRODUCTS GRID */
        .products {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 24px 50px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(6, 182, 212, 0.2);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 12px;
        }

        .product-sizes {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .size-btn {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            background: transparent;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .size-btn:hover {
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        .size-btn.selected {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        /* CART MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-darker);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .cart-item {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 13px;
        }

        .cart-item-size {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .cart-item-remove:hover {
            transform: scale(1.2);
        }

        .cart-total {
            border-top: 1px solid rgba(168, 85, 247, 0.2);
            padding-top: 16px;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 28px;
            cursor: pointer;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            animation: slideIn 0.3s ease-out;
            z-index: 2000;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .header-container {
                gap: 12px;
            }

            .search-bar {
                max-width: 200px;
            }

            .logo-text {
                font-size: 14px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo-section">
                <img id="logoImg" class="logo-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100&h=100&fit=crop" alt="Logo">
                <div class="logo-text" id="shopName">Urban Steps</div>
            </div>
            <div class="search-bar">
                <input type="text" class="search-input" id="headerSearch" placeholder="Search shoes...">
            </div>
            <div class="header-icons">
                <button class="icon-btn" id="whatsappBtn" title="WhatsApp">💬</button>
                <button class="icon-btn" id="callBtn" title="Call">📞</button>
                <button class="icon-btn" id="cartBtn" title="Cart">
                    🛒
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Step Into Style</h1>
        <p>Premium footwear for every occasion</p>
        <div class="hero-search">
            <input type="text" id="heroSearch" placeholder="Find your perfect shoes...">
        </div>
    </section>

    <!-- FILTERS -->
    <section class="filters">
        <div class="filter-label">Filter by Category</div>
        <div class="filter-buttons" id="filterButtons">
            <!-- Generated from admin data -->
        </div>
    </section>

    <!-- PRODUCTS -->
    <section class="products">
        <div class="products-grid" id="productsGrid">
            <!-- Products will be inserted here -->
        </div>
    </section>

    <!-- CART MODAL -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCart()">&times;</button>
            <div class="modal-header">🛒 Your Cart</div>
            <div id="cartItems"></div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalPrice">₹0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWithWhatsApp()">Checkout via WhatsApp</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast" style="display: none;"></div>

    <script>
        // ============================================
        // DEFAULT DATA
        // ============================================
        const DEFAULT_SHOP = {
            name: 'Urban Steps',
            logo: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100&h=100&fit=crop',
            whatsapp: '919876543210',
            phone: '+919876543210'
        };

        const DEFAULT_CATEGORIES = ['Sneakers', 'Formal Shoes', 'Sandals', 'Slippers'];

        const DEFAULT_PRODUCTS = [
            {
                id: 1,
                name: 'Nike Air Sneakers',
                price: 4999,
                image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [7, 8, 9, 10]
            },
            {
                id: 2,
                name: 'Adidas Street Shoes',
                price: 3999,
                image: 'https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [6, 7, 8]
            },
            {
                id: 3,
                name: 'Leather Formal Shoes',
                price: 5999,
                image: 'https://images.unsplash.com/photo-1507340941369-f8e0b0541bed?w=400&h=300&fit=crop',
                category: 'Formal Shoes',
                sizes: [8, 9, 10]
            },
            {
                id: 4,
                name: 'Beach Sandals',
                price: 1999,
                image: 'https://images.unsplash.com/photo-1611592437281-460bfbe1220a?w=400&h=300&fit=crop',
                category: 'Sandals',
                sizes: [6, 7, 8, 9, 10, 11]
            },
            {
                id: 5,
                name: 'Premium Slippers',
                price: 1499,
                image: 'https://images.unsplash.com/photo-1556821552-2e12c7db20b4?w=400&h=300&fit=crop',
                category: 'Slippers',
                sizes: [6, 7, 8, 9, 10]
            },
            {
                id: 6,
                name: 'Running Shoes',
                price: 6999,
                image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop',
                category: 'Sneakers',
                sizes: [7, 8, 9, 10, 11]
            }
        ];

        // ============================================
        // STATE
        // ============================================
        let shop = {};
        let categories = [];
        let products = [];
        let cart = [];
        let selectedSizes = {};
        let currentFilter = 'all';
        let searchQuery = '';

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadDataFromStorage();
            renderFilterButtons();
            renderProducts();
            attachEventListeners();
            updateCartBadge();
        });

        function loadDataFromStorage() {
            // Load shop data
            const storedShop = localStorage.getItem('shopData');
            shop = storedShop ? JSON.parse(storedShop) : DEFAULT_SHOP;

            // Load categories
            const storedCategories = localStorage.getItem('categories');
            categories = storedCategories ? JSON.parse(storedCategories) : DEFAULT_CATEGORIES;

            // Load products
            const storedProducts = localStorage.getItem('products');
            products = storedProducts ? JSON.parse(storedProducts) : DEFAULT_PRODUCTS;

            // Load cart
            const storedCart = localStorage.getItem('cart');
            cart = storedCart ? JSON.parse(storedCart) : [];

            // Update header
            document.getElementById('shopName').textContent = shop.name;
            document.getElementById('logoImg').src = shop.logo;
            document.getElementById('whatsappBtn').onclick = () => openWhatsApp(shop.whatsapp);
            document.getElementById('callBtn').onclick = () => window.location.href = `tel:${shop.phone}`;
        }

        function attachEventListeners() {
            // Cart icon
            document.getElementById('cartBtn').addEventListener('click', openCart);

            // Search
            const heroSearch = document.getElementById('heroSearch');
            const headerSearch = document.getElementById('headerSearch');

            heroSearch.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                headerSearch.value = searchQuery;
                renderProducts();
            });

            headerSearch.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                heroSearch.value = searchQuery;
                renderProducts();
            });

            // Close modal on outside click
            document.getElementById('cartModal').addEventListener('click', (e) => {
                if (e.target.id === 'cartModal') closeCart();
            });
        }

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        function renderFilterButtons() {
            const container = document.getElementById('filterButtons');
            container.innerHTML = '';

            // All button
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'All Products';
            allBtn.onclick = () => setFilter('all');
            container.appendChild(allBtn);

            // Category buttons
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat;
                btn.onclick = () => setFilter(cat);
                container.appendChild(btn);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === filter || (filter === 'all' && btn.textContent === 'All Products')) {
                    btn.classList.add('active');
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesFilter = currentFilter === 'all' || p.category === currentFilter;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || 
                                     p.category.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No products found</div>';
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/400x300?text=Product'">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">₹${product.price}</div>
                        <div class="product-sizes">
                            ${product.sizes.map(size => `
                                <button class="size-btn" onclick="selectSize(${product.id}, ${size})" data-size="${size}">
                                    ${size}
                                </button>
                            `).join('')}
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================
        // CART FUNCTIONS
        // ============================================
        let selectedProductSize = {};

        function selectSize(productId, size) {
            selectedProductSize[productId] = size;
            
            // Update UI
            document.querySelectorAll(`[data-size]`).forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const selectedSize = selectedProductSize[productId];

            if (!selectedSize) {
                showToast('Please select a size first!');
                return;
            }

            const cartItem = {
                productId,
                name: product.name,
                price: product.price,
                size: selectedSize
            };

            cart.push(cartItem);
            saveCart();
            updateCartBadge();
            showToast(`✅ ${product.name} added to cart!`);

            // Reset selection
            delete selectedProductSize[productId];
            renderProducts();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartBadge();
            renderCartItems();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function updateCartBadge() {
            document.getElementById('cartBadge').textContent = cart.length;
        }

        function openCart() {
            document.getElementById('cartModal').classList.add('active');
            renderCartItems();
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function renderCartItems() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);">Your cart is empty</div>';
                document.getElementById('cartTotalPrice').textContent = '₹0';
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-size">Size: ${item.size} | ₹${item.price}</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${idx})">✕</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotalPrice').textContent = `₹${total}`;
        }

        // ============================================
        // WHATSAPP CHECKOUT
        // ============================================
        function checkoutWithWhatsApp() {
            if (cart.length === 0) {
                showToast('Cart is empty!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            let message = 'Hi, I want to order:\n\n';

            cart.forEach(item => {
                message += `• ${item.name} (Size ${item.size}) - ₹${item.price}\n`;
            });

            message += `\nTotal: ₹${total}`;

            openWhatsApp(shop.whatsapp, message);
        }

        function openWhatsApp(number, message = '') {
            const cleanNumber = number.replace(/[^0-9]/g, '');
            const text = message ? encodeURIComponent(message) : '';
            const url = `https://wa.me/${cleanNumber}?text=${text}`;
            window.open(url, '_blank');
        }

        // ============================================
        // UTILITIES
        // ============================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Sync cart when storage changes (from admin panel)
        window.addEventListener('storage', () => {
            loadDataFromStorage();
            renderFilterButtons();
            renderProducts();
            updateCartBadge();
        });
    </script>
</body>
</html>
